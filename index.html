<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SheruStream - Ad-Free</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff3b5c" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f0f0f; color: #fff; padding-bottom: 140px; }
    header { background: #181818; padding: 14px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #2a2a2a; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .logo { font-size: 18px; font-weight: 700; color: #ff3b5c; }
    .status { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: #2a2a2a; color: #aaa; }
    .status.online { background: #143d22; color: #4ade80; }
    .search-box { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #262626; color: #fff; outline: none; font-size: 15px; }
    button { padding: 10px 16px; border-radius: 20px; border: none; background: #ff3b5c; color: #fff; font-weight: 600; cursor: pointer; }
    .tabs { display: flex; background: #181818; border-bottom: 1px solid #2a2a2a; }
    .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; color: #999; cursor: pointer; }
    .tab.active { color: #fff; border-bottom: 2px solid #ff3b5c; font-weight: 600; }
    .list { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card { display: flex; gap: 12px; background: #1a1a1a; padding: 10px; border-radius: 12px; align-items: center; }
    .card img { width: 90px; height: 60px; object-fit: cover; border-radius: 8px; background: #333; }
    .info { flex: 1; overflow: hidden; }
    .title { font-size: 14px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { font-size: 12px; color: #999; margin-top: 4px; }
    .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; background: #2d2d2d; color: #fff; }
    .btn-sm.primary { background: #ff3b5c; }
    
    #video-container { display: none; position: sticky; top: 105px; z-index: 9; background: #000; }
    video { width: 100%; max-height: 230px; }

    .mini-player { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 1px solid #333; padding: 10px 14px; display: none; flex-direction: column; gap: 6px; z-index: 20; }
    .player-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .player-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    audio { width: 100%; height: 32px; }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="logo">▶ SheruStream</div>
    <div id="server-status" class="status">Server waking...</div>
  </div>
  <div class="search-box">
    <input type="text" id="query" placeholder="गाना या मूवी सर्च करें..." onkeypress="if(event.key==='Enter') searchMedia()" />
    <button onclick="searchMedia()">Search</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('online', this)">ऑनलाइन (Ad-Free)</div>
  <div class="tab" onclick="switchTab('offline', this)">ऑफलाइन सेव्ड</div>
</div>

<div id="video-container">
  <video id="video-player" controls playsinline></video>
  <div style="text-align:right; padding:4px 10px; background:#111;">
    <button class="btn-sm" onclick="closeVideo()">वीडियो बंद करें ✕</button>
  </div>
</div>

<div id="online-list" class="list">
  <p style="text-align:center; color:#777; margin-top:40px;">ऊपर अपना पसंदीदा गाना या मूवी सर्च करें</p>
</div>

<div id="offline-list" class="list" style="display:none;"></div>

<div class="mini-player" id="mini-player">
  <div class="player-row">
    <div class="player-title" id="now-playing">लोड हो रहा है...</div>
  </div>
  <audio id="audio-player" controls></audio>
</div>

<script>
  const API_BASE = "https://sheru-stream-api.onrender.com";
  let db;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  fetch(API_BASE + "/")
    .then(r => r.json())
    .then(() => {
      const st = document.getElementById("server-status");
      st.textContent = "Server Ready";
      st.classList.add("online");
    })
    .catch(() => {
      document.getElementById("server-status").textContent = "Waking Server...";
    });

  const req = indexedDB.open("SheruOfflineDB", 1);
  req.onupgradeneeded = e => {
    db = e.target.result;
    db.createObjectStore("media", { keyPath: "id" });
  };
  req.onsuccess = e => { db = e.target.result; loadOfflineList(); };

  function switchTab(tab, el) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("online-list").style.display = tab === "online" ? "flex" : "none";
    document.getElementById("offline-list").style.display = tab === "offline" ? "flex" : "none";
    if (tab === "offline") loadOfflineList();
  }

  async function searchMedia() {
    const q = document.getElementById("query").value.trim();
    if (!q) return;
    const list = document.getElementById("online-list");
    list.innerHTML = "<p style='text-align:center; color:#aaa; margin-top:30px;'>सर्च हो रहा है...</p>";

    try {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      list.innerHTML = "";
      data.results.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.thumbnail}" />
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="meta">${item.channel || "Media"}</div>
            <div class="actions">
              <button class="btn-sm primary" onclick="playStream('${item.id}', 'audio', '${escape(item.title)}', '${item.thumbnail}')">🎵 Audio</button>
              <button class="btn-sm" onclick="playStream('${item.id}', 'video', '${escape(item.title)}', '${item.thumbnail}')">🎬 Video</button>
              <button class="btn-sm" onclick="saveOffline('${item.id}', '${escape(item.title)}', '${item.thumbnail}', this)">⬇ Save</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    } catch (err) {
      list.innerHTML = "<p style='text-align:center; color:#ff5555;'>सर्वर जाग रहा है, 20 सेकंड बाद दोबारा सर्च करें।</p>";
    }
  }

  function playStream(id, type, titleEnc, thumb) {
    const title = unescape(titleEnc);
    const audioEl = document.getElementById("audio-player");
    const videoEl = document.getElementById("video-player");
    const directPlayUrl = `${API_BASE}/play?id=${id}&type=${type}`;

    if (type === "audio") {
      closeVideo();
      document.getElementById("mini-player").style.display = "flex";
      document.getElementById("now-playing").textContent = "बज रहा है: " + title;
      audioEl.src = directPlayUrl;
      audioEl.play();
      setupMediaSession(title, thumb);
    } else {
      audioEl.pause();
      document.getElementById("mini-player").style.display = "none";
      document.getElementById("video-container").style.display = "block";
      videoEl.src = directPlayUrl;
      videoEl.play();
    }
  }

  function closeVideo() {
    const v = document.getElementById("video-player");
    v.pause();
    v.src = "";
    document.getElementById("video-container").style.display = "none";
  }

  function setupMediaSession(title, thumb) {
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: "SheruStream Ad-Free",
        artwork: [{ src: thumb, sizes: "512x512", type: "image/jpeg" }]
      });
    }
  }

  async function saveOffline(id, titleEnc, thumb, btn) {
    const title = unescape(titleEnc);
    btn.textContent = "Saving...";
    btn.disabled = true;
    try {
      const mediaRes = await fetch(`${API_BASE}/play?id=${id}&type=audio`);
      const blob = await mediaRes.blob();

      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").put({ id, title, thumb, blob });
      tx.oncomplete = () => { btn.textContent = "Saved ✓"; };
    } catch (e) {
      btn.textContent = "Retry";
      btn.disabled = false;
    }
  }

  function loadOfflineList() {
    if (!db) return;
    const list = document.getElementById("offline-list");
    list.innerHTML = "";
    const tx = db.transaction("media", "readonly");
    tx.objectStore("media").getAll().onsuccess = e => {
      const items = e.target.result;
      if (!items.length) {
        list.innerHTML = "<p style='text-align:center; color:#777; margin-top:40px;'>कोई ऑफलाइन फाइल सेव नहीं है</p>";
        return;
      }
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.thumb}" />
          <div class="info">
            <div class="title">${item.title}</div>
            <div class="actions">
              <button class="btn-sm primary" onclick="playOffline('${item.id}')">▶ Play Offline</button>
              <button class="btn-sm" onclick="deleteOffline('${item.id}')">🗑 Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    };
  }

  function playOffline(id) {
    const tx = db.transaction("media", "readonly");
    tx.objectStore("media").get(id).onsuccess = e => {
      const item = e.target.result;
      const url = URL.createObjectURL(item.blob);
      const audioEl = document.getElementById("audio-player");
      document.getElementById("mini-player").style.display = "flex";
      document.getElementById("now-playing").textContent = "[Offline] " + item.title;
      audioEl.src = url;
      audioEl.play();
      setupMediaSession(item.title, item.thumb);
    };
  }

  function deleteOffline(id) {
    const tx = db.transaction("media", "readwrite");
    tx.objectStore("media").delete(id);
    tx.oncomplete = () => loadOfflineList();
  }
</script>
</body>
</html>
